services:
  oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: whitelist-oracle
    environment:
      ORACLE_PASSWORD: oracle_root
      APP_USER: whitelist_user
      APP_USER_PASSWORD: whitelist_pass
    ports:
      - "1521:1521"
    volumes:
      - oracle_data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

volumes:
  oracle_data: